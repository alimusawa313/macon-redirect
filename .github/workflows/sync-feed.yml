# Keeps downloads/version.json here identical to the real one on macon.id.
#
# Macs running MacOn 1.4.1 or earlier have the updater feed baked in as
# https://macon.devopsinstitute.id/downloads/version.json. URLSession does
# not run JavaScript, so the redirect pages do nothing for them; what keeps
# them updating is this file being a faithful copy. Its "url" already points
# the DMG at macon.id, so only this one file needs mirroring.
name: Mirror the updater feed
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-feed
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the real feed
        run: curl -fsSL --retry 3 --retry-delay 5 https://macon.id/downloads/version.json -o /tmp/version.json
      - name: Refuse anything that is not a valid feed pointing at macon.id
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/version.json"))
          assert d["version"] and all(p.isdigit() for p in d["version"].split(".")), d.get("version")
          assert d["url"].startswith("https://macon.id/downloads/"), d.get("url")
          assert isinstance(d.get("notes", ""), str)
          print("ok", d["version"])
          PY
      - name: Commit if it changed
        run: |
          if cmp -s /tmp/version.json downloads/version.json; then
            echo "already current"; exit 0
          fi
          cp /tmp/version.json downloads/version.json
          v=$(python3 -c 'import json;print(json.load(open("downloads/version.json"))["version"])')
          git config user.name  "macon-redirect"
          git config user.email "actions@users.noreply.github.com"
          git add downloads/version.json
          git commit -m "Mirror version.json for MacOn $v"
          git push
